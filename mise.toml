[tools]
rust = "stable"
python = "3.12"
zellij = "0.44.2"
uv = "latest"

[tasks.setup]
description = "Install system deps, clone projects at correct version, setup venv and compile"
run = """
#!/bin/bash
set -e

# 1. Détection de l'OS et installation des dépendances système
if [ -f /etc/os-release ]; then
    . /etc/os-release
    case "$ID" in
        ubuntu|debian)
            echo "Detected $ID. Installing system dependencies..."
            sudo apt update && sudo apt install -y build-essential pkg-config libssl-dev git
            ;;
        fedora)
            echo "Detected Fedora. Installing system dependencies..."
            sudo dnf groupinstall -y "Development Tools" && sudo dnf install -y openssl-devel pkgconf-pkg-config git
            ;;
        *)
            echo "Unsupported OS: $ID. Please install build-essential, pkg-config, and openssl-dev manually."
            ;;
    esac
fi

# 2. Clonage et gestion des versions
echo "Checking/Cloning projects..."
for proj in kiwi_hw_control hw_sim; do
    if [ ! -d "$proj" ]; then
        git clone https://github.com/Veriqloud/$proj.git
    fi
    echo "Setting $proj to version 'forumquantiquedefense'..."
    (cd $proj && git fetch origin && git checkout forumquantiquedefense)
done

if [ ! -d "applications_on_qline" ]; then
    git clone https://github.com/Veriqloud/applications_on_qline.git
fi

# 3. Correctifs de bugs et alignement (Fix protocol/config mismatches)
echo "Applying fixes to hw_sim and kiwi_hw_control..."

# Fix typo: decoy_delay -> decoy_fiber_delay in hw_sim
if [ -f "hw_sim/configs/src/ipc/mod.rs" ]; then
    sed -i 's/decoy_delay\\t100/decoy_fiber_delay\\t100/g' hw_sim/configs/src/ipc/mod.rs
    echo "Fixed decoy_delay typo in hw_sim/configs/src/ipc/mod.rs"
fi

# Align BATCHSIZE in kiwi_hw_control/gc to 1024
if [ -f "kiwi_hw_control/gc/src/hw.rs" ]; then
    sed -i 's/pub const BATCHSIZE: usize = 256;/pub const BATCHSIZE: usize = 1024;/g' kiwi_hw_control/gc/src/hw.rs
    echo "Aligned BATCHSIZE in kiwi_hw_control/gc/src/hw.rs to 1024"
fi

# 4. Patch Cargo pour hw_sim (rediriger SSH vers le local)
echo "Redirecting hw_sim dependencies to local kiwi_hw_control..."
if [ -f "hw_sim/Cargo.toml" ]; then
    sed -i 's|gc = { git = "ssh://git@github.com/Veriqloud/kiwi_hw_control.git", branch = "master" }|gc = { path = "../kiwi_hw_control/gc" }|' hw_sim/Cargo.toml
    rm -f hw_sim/Cargo.lock
    echo "Dependency redirected in hw_sim/Cargo.toml and Cargo.lock removed."
fi

# 5. Setup Python avec uv et venv
echo "Setting up Python virtual environment with uv..."
[ ! -d ".venv" ] && uv venv
uv pip install numpy scipy pandas ldpc

# 6. Compilation Rust
echo "Compiling hw_sim..."
(cd hw_sim && cargo build --release)

echo "Compiling kiwi_hw_control/gc (alice and bob binaries)..."
(cd kiwi_hw_control/gc && cargo build --release)

# 7. Préparation logs
mkdir -p applications_on_qline/Q_oblivious_transfer/log

echo "Setup complete."
"""

[tasks.demo]
description = "Launch the OT demo in Zellij"
depends = ["setup"]
run = "zellij --layout demo-layout.kdl"
