[tools]
rust = "stable"
python = "3.12"
zellij = "0.44.2"
uv = "latest"

[tasks.setup]
description = "Complete environment setup"
run = """
#!/bin/bash
set -e
./scripts/install_system_deps.sh
./scripts/clone_projects.sh
./scripts/patch_projects.sh
./scripts/setup_python.sh
./scripts/compile_projects.sh
"""

[tasks.demo]
description = "Launch the OT demo in Zellij"
depends = ["setup"]
run = "zellij --layout demo-layout.kdl"
