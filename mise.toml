[tools]
rust = "stable"
python = "3.12"
zellij = "0.44.2"
uv = "latest"

[env]
# Activation automatique du venv Python dès l'entrée dans le dossier
# Cela permet de lancer 'python script.py' directement avec les dépendances (numpy, etc.)
_.python.venv = ".venv"

[tasks.setup]
description = "Complete environment setup"
run = """
#!/bin/bash
set -e
./scripts/install_system_deps.sh
./scripts/clone_projects.sh
./scripts/patch_projects.sh
./scripts/setup_python.sh
./scripts/compile_projects.sh
"""

[tasks.demo]
description = "Launch the OT demo in Zellij (no config change)"
depends = ["setup"]
run = "zellij --layout demo-layout.kdl"

[tasks.demo_debug]
description = "Launch the OT demo in Zellij with Debug logs"
depends = ["setup"]
run = """
#!/bin/bash
./scripts/set_log_level.sh Debug
zellij --layout demo-layout.kdl
"""
